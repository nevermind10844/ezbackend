<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="layouts/mainlayout">

<head>
	<title th:text="${wrapper.item.namespace} + ' - ' + ${wrapper.item.name}"></title>
</head>

<div layout:fragment="content">
	<h2 th:text="${wrapper.item.namespace} + ' - ' + ${wrapper.item.name}"></h2>
	<form th:action="@{/data/namespace/{namespaceId}/item/{itemId}(namespaceId=${wrapper.item.namespaceId}, itemId=${wrapper.item.id})}"
			method="POST">
		<th:block
				th:replace="data/fragments/template-fragment :: templateFragment(wrapper=${wrapper}, isRecursive=false)">
		<button class="btn btn-primary" type="submit">Speichern</button>
	</form>
</div>
